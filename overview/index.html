<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Packshoter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ── Палитра взята у самого инструмента: #232323 — фон окон Packshoter,
     #ffaa00 — его акцент, #6496c8 — второй акцент интерфейса загрузчика. ── */
:root{
  --ground:#f7f5f2; --surface:#ffffff; --surface-2:#f1ede7; --sunken:#ebe6de;
  --ink:#1b1a18; --ink-soft:#413d38; --muted:#6b655c; --line:#ded8cf; --line-soft:#eae4db;
  --accent:#b76e00; --accent-ink:#8a5400; --accent-soft:#fdf1dd;
  --blue:#3c6f9f; --blue-soft:#e8eff7;
  --good:#3d7a4d; --warn:#9a6a14; --bad:#a34036;
  --shadow:0 1px 2px rgba(27,26,24,.05), 0 8px 24px -16px rgba(27,26,24,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#191817; --surface:#232323; --surface-2:#2b2a28; --sunken:#1f1e1c;
    --ink:#eae6e0; --ink-soft:#c9c4bc; --muted:#948d84; --line:#3a3835; --line-soft:#302f2c;
    --accent:#ffaa00; --accent-ink:#ffc04d; --accent-soft:#33260c;
    --blue:#6496c8; --blue-soft:#1d2a36;
    --good:#74b183; --warn:#d9a441; --bad:#e07c6c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#191817; --surface:#232323; --surface-2:#2b2a28; --sunken:#1f1e1c;
  --ink:#eae6e0; --ink-soft:#c9c4bc; --muted:#948d84; --line:#3a3835; --line-soft:#302f2c;
  --accent:#ffaa00; --accent-ink:#ffc04d; --accent-soft:#33260c;
  --blue:#6496c8; --blue-soft:#1d2a36;
  --good:#74b183; --warn:#d9a441; --bad:#e07c6c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100% }
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.62; letter-spacing:-.003em;
}
h1,h2,h3,h4{font-family:"IBM Plex Sans Condensed","IBM Plex Sans","Segoe UI",sans-serif;font-weight:600;text-wrap:balance;margin:0}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}

/* ── Шапка ─────────────────────────────────────────────────────────── */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.top-in{max-width:1080px; margin:0 auto; padding:10px 20px; display:flex; gap:16px; align-items:center; justify-content:space-between}
.brand{display:flex; align-items:baseline; gap:10px; min-width:0}
.brand b{font-family:"IBM Plex Sans Condensed",sans-serif; font-size:19px; letter-spacing:.01em}
.brand span{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.langs{display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:2px}
.langs button{
  font:500 12px/1 "IBM Plex Mono",monospace; letter-spacing:.06em; text-transform:uppercase;
  background:transparent; color:var(--muted); border:0; border-radius:5px; padding:7px 11px; cursor:pointer;
}
.langs button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.langs button:focus-visible, a:focus-visible, .tocs a:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ── Общая раскладка ───────────────────────────────────────────────── */
.wrap{max-width:1080px; margin:0 auto; padding-inline:20px; padding-block:0 96px}
.hero{padding-block:56px 40px; border-bottom:1px solid var(--line); display:grid; gap:22px}
.eyebrow{font:500 11px/1 "IBM Plex Mono",monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-ink)}
.hero h1{font-size:clamp(18px,6.4vw,26px); line-height:1.02; letter-spacing:-.02em}
.hero .lede{font-size:clamp(17px,2.1vw,20px); color:var(--ink-soft); max-width:60ch}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:6px}
.stat{background:var(--surface); padding:16px 18px; display:grid; gap:3px}
.stat b{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:27px; font-variant-numeric:tabular-nums; color:var(--accent-ink); line-height:1.1}
.stat span{font-size:13px; color:var(--muted)}

.tocs{display:flex; flex-wrap:wrap; gap:8px; padding-block:26px; border-bottom:1px solid var(--line)}
.tocs a{
  font:500 12px/1 "IBM Plex Mono",monospace; color:var(--muted); text-decoration:none;
  border:1px solid var(--line); border-radius:6px; padding:8px 11px; background:var(--surface);
}
.tocs a:hover{color:var(--ink); border-color:var(--accent)}
.tocs a b{color:var(--accent-ink); font-weight:600; margin-inline-end:6px}

section{padding-block:56px; border-bottom:1px solid var(--line-soft); scroll-margin-top:72px}
.sec-head{display:grid; gap:10px; margin-bottom:26px}
.sec-num{font:600 12px/1 "IBM Plex Mono",monospace; color:var(--accent-ink); letter-spacing:.1em}
.sec-head h2{font-size:clamp(26px,3.6vw,36px); line-height:1.12; letter-spacing:-.015em}
.sec-head .sub{color:var(--muted); font-size:15px; max-width:62ch}

.body{display:grid; gap:20px; max-width:72ch}
.body p{margin:0}
.body p.wide, .wide{max-width:none}
strong{font-weight:600}
.mark{color:var(--accent-ink); font-weight:600}

ul.list{margin:0; padding:0; list-style:none; display:grid; gap:11px}
ul.list li{padding-inline-start:20px; position:relative}
ul.list li::before{content:""; position:absolute; inset-block-start:.62em; inset-inline-start:2px; width:7px; height:1px; background:var(--accent)}
ul.list li b{font-weight:600}

/* ── Карточки, таблицы, шаги ───────────────────────────────────────── */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(248px,1fr)); gap:14px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px 20px; display:grid; gap:8px; align-content:start}
.card h3{font-size:18px}
.card p{margin:0; font-size:14.5px; color:var(--ink-soft)}
.card .tag{font:500 11px/1 "IBM Plex Mono",monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:14.5px; min-width:440px}
th,td{text-align:start; padding:11px 16px; border-bottom:1px solid var(--line-soft); vertical-align:top}
th{font:600 11px/1.4 "IBM Plex Mono",monospace; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; color:var(--accent-ink); font-weight:600; white-space:nowrap}
td code, .body code{font-size:.9em; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:4px; padding:1px 5px}

.steps{display:grid; gap:12px; counter-reset:s}
.step{display:grid; grid-template-columns:34px 1fr; gap:14px; align-items:start; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:15px 18px}
.step .n{font:600 13px/34px "IBM Plex Mono",monospace; width:34px; height:34px; text-align:center; border-radius:8px; background:var(--accent-soft); color:var(--accent-ink)}
.step h4{font-size:16px; margin-bottom:2px}
.step p{margin:0; font-size:14.5px; color:var(--ink-soft)}

/* ── Схема процесса: цепочка звеньев со стрелками ──────────────────── */
/* Сетка 3×2 «змейкой»: верхний ряд идёт слева направо, нижний — справа налево,
   поэтому поток не разрывается между рядами. Если оба ряда читать в одну
   сторону, они выглядят как две независимые цепочки — так и было.
   Звеньев ровно шесть, строки заполняются целиком, высоту выравнивает grid. */
.flow{display:grid; grid-template-columns:repeat(3,1fr); gap:34px 30px}
.flow .fl{
  position:relative; display:grid; gap:2px; align-content:start; background:var(--surface);
  border:1px solid var(--line); border-radius:9px; padding:12px 14px; min-width:0;
}
.flow .fl b{font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:600; font-size:14.5px}
.flow .fl span{font-size:12.5px; color:var(--muted)}

/* Позиции задаём полностью — и колонку, и строку. Если указать только колонку,
   grid уводит каждое звено в собственную строку, и сетка рассыпается. */
.flow .fl:nth-child(1){grid-area:1/1}
.flow .fl:nth-child(2){grid-area:1/2}
.flow .fl:nth-child(3){grid-area:1/3}
.flow .fl:nth-child(4){grid-area:2/3}
.flow .fl:nth-child(5){grid-area:2/2}
.flow .fl:nth-child(6){grid-area:2/1}

/* Указатели — треугольники, а не стрелки-символы: те в разных шрифтах рисуются
   волосяной линией и в жирном начертании не становятся заметнее. */
.flow .fl::after{position:absolute; color:var(--accent); font-size:13px; line-height:1}
.flow .fl:nth-child(1)::after, .flow .fl:nth-child(2)::after{
  content:"▶"; inset-inline-end:-21px; top:50%; transform:translateY(-50%);
}
.flow .fl:nth-child(3)::after{
  content:"▼"; inset-inline-start:50%; bottom:-24px; transform:translateX(-50%);
}
.flow .fl:nth-child(4)::after, .flow .fl:nth-child(5)::after{
  content:"◀"; inset-inline-start:-21px; top:50%; transform:translateY(-50%);
}

/* Возврат на доработку — путь назад, поэтому и цвет другой, и стрелка обратная. */
.flowback{
  display:flex; align-items:center; gap:10px; margin-top:8px; padding:9px 13px;
  border:1px dashed color-mix(in srgb, var(--bad) 45%, var(--line));
  border-radius:9px; color:var(--bad); font-size:13.5px;
}
.flowback .hook{font-size:16px; line-height:1}

/* Узкий экран: змейка теряет смысл — выстраиваем в столбец, указатели вниз. */
@media (max-width:820px){
  .flow{grid-template-columns:1fr; gap:26px 0}
  .flow .fl:nth-child(1){grid-area:1/1}
  .flow .fl:nth-child(2){grid-area:2/1}
  .flow .fl:nth-child(3){grid-area:3/1}
  .flow .fl:nth-child(4){grid-area:4/1}
  .flow .fl:nth-child(5){grid-area:5/1}
  .flow .fl:nth-child(6){grid-area:6/1}
  .flow .fl::after{
    content:"▼" !important; inset-inline-end:auto; inset-inline-start:50%;
    top:auto; bottom:-20px; transform:translateX(-50%);
  }
  .flow .fl:last-child::after{content:none !important}
}

/* ── Диаграмма архитектуры ─────────────────────────────────────────── */
.arch{display:grid; gap:10px}
.lane{display:grid; grid-template-columns:118px 1fr; gap:12px; align-items:stretch}
.lane .who{font:500 11px/1.4 "IBM Plex Mono",monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding-top:14px}
.lane .boxes{display:flex; flex-wrap:wrap; gap:10px}
.box{background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:12px 15px; display:grid; gap:3px; flex:1 1 180px; min-width:0}
.box b{font-size:15px; font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:600}
.box span{font-size:13px; color:var(--muted)}
.box.key{border-color:var(--accent); background:var(--accent-soft)}
.box.key span{color:var(--accent-ink)}
.box.cold{border-style:dashed; background:transparent}
.flowline{display:flex; align-items:center; gap:10px; padding-inline-start:130px; color:var(--muted); font:500 12px/1 "IBM Plex Mono",monospace}
.flowline::before{content:"↓"; color:var(--accent)}

/* ── Вопрос-ответ ──────────────────────────────────────────────────── */
.qa{display:grid; gap:2px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.qa > div{background:var(--surface); padding:16px 20px; display:grid; gap:5px}
.qa h4{font-size:15.5px; color:var(--ink)}
.qa p{margin:0; font-size:14.5px; color:var(--ink-soft)}

/* ── Статусы ───────────────────────────────────────────────────────── */
.pill{display:inline-flex; align-items:center; gap:6px; font:500 11px/1 "IBM Plex Mono",monospace; letter-spacing:.06em; text-transform:uppercase; border-radius:99px; padding:5px 10px; border:1px solid}
.pill::before{content:""; width:6px; height:6px; border-radius:99px; background:currentColor}
.pill.ok{color:var(--good); border-color:color-mix(in srgb,var(--good) 40%, transparent); background:color-mix(in srgb,var(--good) 8%, transparent)}
.pill.wip{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 40%, transparent); background:color-mix(in srgb,var(--warn) 8%, transparent)}
.pill.no{color:var(--bad); border-color:color-mix(in srgb,var(--bad) 40%, transparent); background:color-mix(in srgb,var(--bad) 8%, transparent)}

.note{border-inline-start:2px solid var(--accent); background:var(--surface-2); border-radius:0 8px 8px 0; padding:14px 18px; font-size:14.5px; color:var(--ink-soft)}
.note b{color:var(--ink)}
.note.blue{border-color:var(--blue); background:var(--blue-soft)}
/* Красноватая врезка — то, чего ещё нет. Фон приглушённый: это предупреждение,
   а не ошибка, и оно не должно перекрикивать остальной текст. */
.note.red{border-color:var(--bad); border-inline-start-width:3px; background:color-mix(in srgb, var(--bad) 22%, var(--surface))}

/* ── Скриншоты ─────────────────────────────────────────────────────── */
figure{margin:0; display:grid; gap:8px}
figure img{width:100%; max-width:100%; display:block; border:1px solid var(--line); border-radius:10px; background:var(--sunken); cursor:zoom-in}
figure img:hover{border-color:var(--accent)}

/* Просмотр во весь размер. Скриншоты интерфейса плотные: в колонке текста
   мелкие подписи не читаются, поэтому по клику картинка открывается целиком. */
.lightbox{
  position:fixed; inset:0; z-index:60; display:none;
  background:rgba(12,11,10,.94); padding:24px; cursor:zoom-out;
}
.lightbox[data-open="1"]{display:grid; grid-template-rows:1fr auto; gap:14px; place-items:center}
.lightbox img{max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.6)}
.lightbox .cap{color:#cfc9c0; font-size:13.5px; text-align:center; max-width:70ch}
.lightbox .close{
  position:absolute; top:14px; inset-inline-end:18px; width:38px; height:38px; border-radius:8px;
  background:rgba(255,255,255,.08); color:#f0ebe4; border:1px solid rgba(255,255,255,.18);
  font:400 20px/1 "IBM Plex Sans",sans-serif; cursor:pointer;
}
.lightbox .close:hover{background:rgba(255,255,255,.16)}
figure .slot{
  border:1px dashed var(--line); border-radius:10px; background:var(--sunken);
  min-height:150px; display:grid; place-items:center; color:var(--muted);
  font:500 12px/1 "IBM Plex Mono",monospace; letter-spacing:.06em; text-align:center; padding:20px;
}
figcaption{font-size:13px; color:var(--muted)}
/* Ровно две колонки: скриншоты интерфейса плотные, в три и больше они
   превращаются в нечитаемые марки. На телефоне — одна. */
.shots{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
@media (max-width:720px){ .shots{grid-template-columns:1fr} }

footer{padding-block:34px; color:var(--muted); font-size:13.5px; display:grid; gap:6px}
footer .mono{font-size:12px}

@media (max-width:640px){
  .lane{grid-template-columns:1fr; gap:6px}
  .lane .who{padding-top:0}
  .flowline{padding-inline-start:0}
  section{padding-block:44px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>Packshoter</b><span id="brandsub"></span></div>
    <div class="langs" id="langs" role="group">
      <button type="button" id="lang-en" data-l="en">EN</button>
      <button type="button" id="lang-fr" data-l="fr">FR</button>
      <button type="button" id="lang-ru" data-l="ru">RU</button>
    </div>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="">
  <button type="button" class="close" id="lbclose" aria-label="Close">✕</button>
  <img id="lbimg" alt="">
  <div class="cap" id="lbcap"></div>
</div>

<script>
/* ===========================================================================
   Содержание страницы. Один и тот же скелет на трёх языках: секции и блоки
   совпадают по структуре, меняется только текст. Так ни один язык не может
   тихо отстать от другого — расхождение сразу видно по разной длине массива.
   =========================================================================== */

const CONTENT = {};

/* ─────────────────────────── РУССКИЙ ─────────────────────────── */
CONTENT.ru = {
  sub: "Плагин для 3ds Max: проверка, стандартизация и упаковка 3D-моделей",
  statusLabels: { ok:"готово", wip:"в работе", no:"нет" },
  shotLabel: "скриншот будет добавлен",
  hero: {
    eyebrow: "Техническое описание",
    h1: "",
    lede: "Packshoter это плагин для 3ds Max. Он создает сцену для готовой модели, ставит камеры и свет, выравнивает модель в кадре, запекает AO и рендерит превью. Затем проверяет сцену по сорока пяти этапам, исправляет три сотни типовых ошибок одним нажатием и собирает готовый ZIP-архив, который содержит:<br><span class=\"lede-list\">— сцену 3ds Max с текстурами<br>— превью модели 1000×750<br>— экспорты: GLB, FBX, OBJ</span><br><br>В дополнение к Packshoter идет ModelChecker, который позволяет проверить модель визуально в браузере: сначала модель осматривает моделлер, после загрузки на проверку — верификатор.",
    stats: [
      { n: "45", l: "этапов проверки", h: "от имён и папок до UV и материалов" },
      { n: "~280", l: "видов ошибок", h: "каждое с собственным кодом" },
      { n: "313", l: "автоисправлений", h: "по кнопке FIX, без ручной правки" },
      { n: "12", l: "режимов визуальной проверки", h: "в браузерном ModelChecker" }
    ]
  },
  toc: "Содержание",
  sections: [
    /* 1 ─────────────────────────────────────────────────────────── */
    {
      id: "tools", num: "01", title: "Два инструмента",
      sub: "Packshoter работает у моделлера внутри 3ds Max, ModelChecker — у моделлера и верификатора в браузере.",
      blocks: [
        { t: "cards", v: [
          { tag: "3ds Max · рабочее место моделлера", h: "Packshoter", p: "Сборка сцены, камеры, свет, запекание AO, рендер превью, проверка сцены, автоисправления, упаковка архива. Здесь модель создаётся и приводится к стандарту." },
          { tag: "Браузер · рабочее место верификатора", h: "ModelChecker", p: "Визуальная проверка готового GLB в двенадцати режимах: карты материалов по отдельности, форма без текстур, нормали, изнанка, развёртка UV. Ничего не меняет — только показывает." }
        ]},
        { t: "shots", v: [

      blocks: [
        { t: "qa", v: [
          { q: "How does a user sign in?", a: "Through Google, by the flow standard for desktop applications. The password is entered on Google's own page; the application never sees it. The session survives restarts of 3ds Max and renews itself without a further sign-in." },
          { q: "How does the server satisfy itself that it really is them?", a: "The identity Packshoter presents is verified by its signature against Google's public keys. Without that check, anyone could compose an identity carrying somebody else's address." },
          { q: "What roles exist, and where do they come from?", a: "The role is held in the modellers' table and read by the server on every request. It determines whether uploading is permitted and which folder the file lands in. The application itself holds no roles." },

          { q: "Which system starts the scene checks in Packshoter?", a: "None. The modeller starts them by hand, from the 3ds Max menu on their own machine. There is no automatic start and there cannot be one: the checks work on a scene open inside 3ds Max. A call along the lines of “submit this model for checking” does not exist and is not planned." },
          { q: "And who starts ModelChecker?", a: "3D Model QC, by hand, when they take a model on. How word reaches them that a model is waiting is a question for the Airtable side: the review queue is kept there, not with us.<br><br><b>What we suggest.</b> As soon as the status becomes <code>uploaded</code>, the model appears in a “to review” view. The record carries a permanent link that opens ModelChecker on that very model — 3D Model QC has nothing to search for and nothing to download. The decision goes into the same record: <code>approved</code> or <code>rejected</code>, with the reason written down when a model is returned." },
          { q: "What does ModelChecker return?", a: "Nothing. It is a viewing window: it loads the GLB and shows it in various modes. The outcome of the visual inspection is the decision of 3D Model QC, which they enter in the model record. ModelChecker neither creates nor alters any file." },
          { q: "What statuses are there?", a: "Three are set by our side as the upload proceeds; the rest by 3D Model QC and by the recipient's program. The full list is in the table below." },
          { q: "What formats and sizes?", a: "Coming in: a 3ds Max scene, PNG textures at 4096×4096, an HDR for the environment. Going out: a single ZIP holding the scene with its textures, a 1000×750 PNG preview and the GLB, FBX and OBJ exports; <br> the GLB and the preview are additionally placed as separate files. <br> The archive usually weighs 100–600 MB, occasionally up to 2–4 GB. There is no hard ceiling: the upload runs in parts." },
          { q: "How long do files stay with us?", a: "Until the “collected” flag is set, plus a few days in reserve, in case a file has to be collected a second time. We do not delete on a timer: that would risk erasing something nobody has managed to collect yet. The exact reserve has not been fixed; it depends on how often the recipient collects." },
          { q: "What happens when a model is submitted again?", a: "A new version appears beside the previous one; nothing is overwritten. An interrupted upload resumes from where it broke off and creates no second copy. Nor does a duplicate record appear: the server creates the record once, when the upload begins." },
          { q: "How does the result reach Airtable?", a: "We send neither a webhook nor a reply to a request. Our server fills in the record itself, as the upload proceeds and once it is complete. The recipient's side works with the table: reads the status and the file path, collects the archive and sets the “collected” flag. No separate interface is required for this." },
          { q: "Is there a list of error codes?", a: "The codes belong to the scene checks and are visible to the modeller in 3ds Max — they describe faults in the model, not in the exchange. There are no integration error codes, because there is no interface that would return them: the outcome reaches the record as a status, and the reason for a refusal as text in a separate field." },

const esc = s => String(s);

function block(b){
  switch(b.t){
    case "p":    return `<p class="wide">${esc(b.v)}</p>`;
    case "h3":   return `<h3 class="sub-h">${esc(b.v)}</h3>`;
    case "note": return `<div class="note">${esc(b.v)}</div>`;
    case "note blue": return `<div class="note blue">${esc(b.v)}</div>`;
    case "note red":  return `<div class="note red">${esc(b.v)}</div>`;
    case "list":
      return `<ul class="list">${b.v.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
    case "cards":
      return `<div class="cards">${b.v.map(c=>
        `<div class="card"><span class="tag">${esc(c.tag)}</span><h3>${esc(c.h)}</h3><p>${esc(c.p)}</p></div>`).join("")}</div>`;
    case "steps":
      return `<div class="steps">${b.v.map((s,i)=>
        `<div class="step"><div class="n">${i+1}</div><div><h4>${esc(s.h)}</h4><p>${esc(s.p)}</p></div></div>`).join("")}</div>`;
    case "table":
      return `<div class="tablewrap"><table><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>`+
        `<tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "statustable":
      return `<div class="tablewrap"><table><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>`+
        `<tbody>${b.rows.map(r=>`<tr><td><span class="pill ${r[0]}">${STATUS_LABEL[r[0]]}</span></td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div>`;
    case "qa":
      return `<div class="qa">${b.v.map(x=>`<div><h4>${esc(x.q)}</h4><p>${esc(x.a)}</p></div>`).join("")}</div>`;
    case "shots":
      return `<div class="shots">${b.v.map(f=>
        `<figure><div class="slot" data-src="${f.src}">${SHOT_LABEL}</div><figcaption>${esc(f.cap)}</figcaption></figure>`).join("")}</div>`;
    case "flow":
      return `<div class="flow">${b.v.map(s=>
        `<span class="fl"><b>${esc(s.b)}</b><span>${esc(s.s)}</span></span>`).join("")}</div>`
        + (b.back ? `<div class="flowback"><span class="hook" aria-hidden="true">↩</span><span>${esc(b.back)}</span></div>` : "");
    case "arch":
      return `<div class="arch">${b.v.lanes.map((l,i)=>
        `<div class="lane"><div class="who">${esc(l.who)}</div><div class="boxes">${
          l.boxes.map(x=>`<div class="box${x.key?" key":""}${x.cold?" cold":""}"><b>${esc(x.b)}</b><span>${esc(x.s)}</span></div>`).join("")
        }</div></div>` + (i < b.v.lanes.length-1 ? `<div class="flowline"></div>` : "")).join("")}</div>`;
    default: return "";
  }
}

let STATUS_LABEL = {}, SHOT_LABEL = "";

function render(lang){
  const C = CONTENT[lang];
  // Запасные подписи — на английском: он же язык по умолчанию.
  STATUS_LABEL = C.statusLabels || { ok:"done", wip:"under way", no:"not yet" };
  SHOT_LABEL   = C.shotLabel || "screenshot to follow";

  document.documentElement.lang = lang;
  document.getElementById("brandsub").textContent = C.sub;
  document.title = "Packshoter";

  const toc = C.sections.map(s=>`<a href="#${s.id}"><b>${s.num}</b>${esc(s.title)}</a>`).join("");

  document.getElementById("app").innerHTML = `
    <div class="hero">
      <div class="eyebrow">${esc(C.hero.eyebrow)}</div>
      <h1>${esc(C.hero.h1)}</h1>
      <p class="lede">${esc(C.hero.lede)}</p>
      <div class="stats">${C.hero.stats.map(s=>
        `<div class="stat"><b>${esc(s.n)}</b><span>${esc(s.l)}</span><span>${esc(s.h)}</span></div>`).join("")}</div>
    </div>
    <nav class="tocs" aria-label="${esc(C.toc)}">${toc}</nav>
    ${C.sections.map(s=>`
      <section id="${s.id}">
        <div class="sec-head">
          <div class="sec-num">${esc(s.num)}</div>
          <h2>${esc(s.title)}</h2>
          <p class="sub">${esc(s.sub)}</p>
        </div>
        <div class="body">${s.blocks.map(block).join("")}</div>
      </section>`).join("")}
    <footer>${C.footer.map((f,i)=>`<div${i?' class="mono"':''}>${esc(f)}</div>`).join("")}</footer>
  `;

  // Скриншоты: если файл существует — показываем его вместо заглушки.
  document.querySelectorAll(".slot[data-src]").forEach(slot=>{
    const src = slot.getAttribute("data-src");
    const img = new Image();
    img.onload = ()=>{ slot.replaceWith(img); };
    img.alt = slot.parentElement.querySelector("figcaption").textContent;
    img.src = src;
  });

  document.querySelectorAll("#langs button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  try{ localStorage.setItem("pshtr-lang", lang); }catch(e){}
}

/* ── Просмотр скриншота во весь размер ───────────────────────────── */
const LB = document.getElementById("lightbox");
const LBIMG = document.getElementById("lbimg");
const LBCAP = document.getElementById("lbcap");

function openShot(img){
  LBIMG.src = img.currentSrc || img.src;
  LBIMG.alt = img.alt || "";
  LBCAP.textContent = img.alt || "";
  LB.setAttribute("data-open","1");
  document.getElementById("lbclose").focus();
}
function closeShot(){
  LB.removeAttribute("data-open");
  LBIMG.removeAttribute("src");          // чтобы большая картинка не висела в памяти
}

document.getElementById("app").addEventListener("click", e=>{
  const img = e.target.closest("figure img");
  if(img) openShot(img);
});
LB.addEventListener("click", closeShot);  // клик в любом месте закрывает
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeShot(); });

document.getElementById("langs").addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(b && CONTENT[b.dataset.l]) render(b.dataset.l);
});

/* По умолчанию английский: страница уходит наружу, и англоязычная версия —
   общий знаменатель. Французскую и русскую подставляем только тем, у кого
   такой язык в браузере, либо тем, кто выбрал её кнопкой раньше. */
let start = "en";
try{
  const saved = localStorage.getItem("pshtr-lang");
  if(saved && CONTENT[saved]) start = saved;
  else if((navigator.language||"").startsWith("fr") && CONTENT.fr) start = "fr";
  else if((navigator.language||"").startsWith("ru") && CONTENT.ru) start = "ru";
}catch(e){}
render(start);
</script>

.sub-h{font-size:19px; margin-top:12px; letter-spacing:-.01em}
.sub-h:first-child{margin-top:0}

/* Состав архива в шапке: приглушённый синий — второй акцент интерфейса.
   Отделяет перечисление от текста, не перетягивая на себя внимание. */
.lede-list{color:var(--blue)}

/* Запрет, а не предупреждение: красный из набора темы, читаемый на обоих фонах.
   Отдельной строкой — иначе тонет в конце абзаца. */
.warn-line{color:var(--bad); font-weight:500; display:inline-block; margin-top:6px}
</style>
